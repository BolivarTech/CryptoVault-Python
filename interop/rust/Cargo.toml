[package]
name = "cryptovault-interop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fixture generator and verifier that pins CryptoVault-Python to the cryptovault crate."
license = "MIT OR Apache-2.0"

[dependencies]
cryptovault = "=0.3.0"
aes-gcm-siv = "0.11"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
