name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same suite before it builds anything, so the gates a
  # release must pass are defined once, here.
  workflow_call:

permissions:
  contents: read

jobs:
  # Every `uv sync` builds the project with maturin, which compiles the codec
  # extension in native/, so each job that syncs needs a Rust toolchain.
  gates:
    name: gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Runs the crate fixtures against both codec backends; a missing
      # extension fails the suite instead of skipping the compiled half.
      - run: uv run pytest

  lowest:
    name: lowest supported dependencies (Python 3.11)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv run --isolated --resolution lowest-direct pytest

  interop:
    name: Rust crate interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      - run: uv run pytest -m interop

  native:
    name: native extension (fmt, clippy, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo audit

  package:
    name: audit and build
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      - run: uv run pip-audit
      - run: uv build
