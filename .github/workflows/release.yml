name: Release

# The version in `pyproject.toml` is the SINGLE SOURCE OF TRUTH for a release.
#
# Push a version bump to `main` and this workflow validates it, runs the CI
# suite, builds the compiled wheels, the pure-Python wheel and the sdist,
# installs the wheels in clean environments, publishes to PyPI and only THEN
# creates the `vX.Y.Z` tag and the GitHub Release. Pushes that do not change the version are a no-op: the gate
# reports "already released" and nothing downstream runs.
#
# The tag is created last so that it means exactly one thing: this version
# built, passed, published and released. A tag pushed first would be left
# pointing at a broken commit whenever a later step failed.
on:
  push:
    branches: [main]
  # PRs run the GATE ONLY, never a build or a release, so a version rollback or
  # a bump without a CHANGELOG entry is caught at review time, not after merge.
  pull_request:
    branches: [main]
  # Manual dry-run: CI, build and wheel smoke WITHOUT publishing or tagging.
  workflow_dispatch:

# Serialise release runs. `cancel-in-progress: false` lets a run that may
# already have published finish instead of being killed by the next merge.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything hangs off this job, so a bad bump costs seconds instead of a
  # full build. It answers: "should this push cut a release, and is it safe?"
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      is_new_version: ${{ steps.gate.outputs.is_new_version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      # `fetch-depth: 0` because the rollback check needs the full tag list; a
      # shallow clone fetches no tags and would conclude nothing was released.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: gate
        name: Resolve version, block rollbacks, decide whether to release
        run: |
          set -euo pipefail

          # The first `version = ` at column 0 is the [project] one.
          V="$(grep -m1 '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ -z "$V" ]; then
            echo "::error::could not extract the project version from pyproject.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $V"

          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$V' is not a plain X.Y.Z; refusing to derive a tag from it."
            exit 1
          fi

          NEWVER=true

          # ROLLBACK PROTECTION against the highest X.Y.Z ever tagged, not
          # against "does vX.Y.Z exist": rolling back to an old released
          # version would otherwise look like a harmless no-op.
          MAX="$(git tag -l 'v*' | sed 's/^v//' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          echo "highest version released so far: ${MAX:-<none>}"

          if [ -z "$MAX" ]; then
            echo "No release tags yet; $V will be the first."
          elif [ "$V" = "$MAX" ]; then
            echo "Version $V is already released as v$MAX; nothing to release."
            NEWVER=false
          elif [ "$(printf '%s\n%s\n' "$V" "$MAX" | sort -V | head -1)" = "$V" ]; then
            echo "::error::ROLLBACK BLOCKED: pyproject.toml declares $V but v$MAX is already released. Bump past $MAX or restore the correct version."
            exit 1
          else
            echo "New version $V > $MAX."
          fi

          if [ "$NEWVER" = "true" ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists but is not the highest release; refusing to overwrite it."
            exit 1
          fi
          echo "is_new_version=$NEWVER" >> "$GITHUB_OUTPUT"

          # Releasing needs BOTH a new version and a push to main.
          SHOULD="$NEWVER"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Event is '${{ github.event_name }}': validation only, nothing is published or tagged."
            SHOULD=false
          fi
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "--> is_new_version=$NEWVER  should_release=$SHOULD"

      # A bump committed without its lockfile would make every `--locked` step
      # downstream fail; this re-resolves against the committed lock in seconds.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Assert uv.lock is in sync with pyproject.toml
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' and commit the result together with the version bump."
            exit 1
          fi

      # maturin takes the version from pyproject.toml; native/Cargo.toml carries
      # the same number so the extension crate never claims another release.
      - name: Assert native/Cargo.toml has the same version
        run: |
          set -euo pipefail
          C="$(grep -m1 '^version = ' native/Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ "$C" != "${{ steps.gate.outputs.version }}" ]; then
            echo "::error::native/Cargo.toml says $C but pyproject.toml says ${{ steps.gate.outputs.version }}. Bump both, then run 'cargo update -p cryptovault-native --manifest-path native/Cargo.toml'."
            exit 1
          fi
          echo "OK: native/Cargo.toml is at $C."

      # Keyed on `is_new_version`, so a PR that bumps is told at review time.
      # The release notes are extracted from this section, and a section still
      # marked "Unreleased" would ship notes that contradict the release.
      - name: Assert CHANGELOG has a dated entry for this version
        if: steps.gate.outputs.is_new_version == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.gate.outputs.version }}"
          if ! grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$V] - YYYY-MM-DD' section. Add or date it before releasing."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $V with a release date."

  # The same suite as every push and PR, defined once in ci.yml. Only for a
  # real release or a dry-run: ci.yml already runs on each push to main.
  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  # One abi3 wheel per platform: it carries the compiled codecs and serves
  # every CPython from 3.11 on. Built in the manylinux/musllinux containers on
  # Linux, so the glibc floor is 2.17.
  wheels:
    name: Wheel ${{ matrix.name }}
    needs: [gate, ci]
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: windows-x86_64, os: windows-latest, target: x64, manylinux: "off" }
          - { name: macos-universal2, os: macos-14, target: universal2-apple-darwin, manylinux: "off" }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # The sdist, and the pure-Python wheel that pip falls back to on any platform
  # without a compiled one (and on interpreters abi3 does not cover). That
  # wheel is built with uv_build, which packages `src/cryptovault` alone.
  pure:
    name: sdist and pure-Python wheel
    needs: [gate, ci]
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, toolchain: stable
        with:
          toolchain: stable
      - run: uv build --sdist
      - name: Build the pure-Python wheel with uv_build
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import pathlib, re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          block = re.compile(
              r'^\[build-system\]\nrequires = \[[^\]]*\]\nbuild-backend = "maturin"\n', re.M)
          text, count = block.subn(
              '[build-system]\nrequires = ["uv_build>=0.13.0,<0.14"]\n'
              'build-backend = "uv_build"\n', text)
          if count != 1:
              raise SystemExit("could not find the maturin [build-system] table")
          path.write_text(text, encoding="utf-8")
          EOF
          uv build --wheel
          git checkout -- pyproject.toml
      - uses: actions/upload-artifact@v5
        with:
          name: dist-pure
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # Proof, not assumption: exactly the expected distributions, each carrying
  # the package, its metadata and the licenses and nothing else (no tests,
  # fixtures or the Rust interop tool; musllinux wheels also carry the libgcc_s
  # auditwheel vendors). Every compiled wheel has the extension, the pure one
  # has none, and all of them ship the same Python sources.
  verify:
    name: Verify distributions
    needs: [gate, wheels, pure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check names and contents
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, sys, tarfile, zipfile

          v = os.environ["VERSION"]
          stem = f"cryptovault_py-{v}"
          dist = pathlib.Path("dist")
          names = sorted(p.name for p in dist.iterdir() if not p.name.startswith("."))
          platforms = [r"manylinux_2_17_x86_64\.manylinux2014_x86_64",
                       r"manylinux_2_17_aarch64\.manylinux2014_aarch64",
                       r"musllinux_1_2_x86_64", r"musllinux_1_2_aarch64",
                       r"win_amd64",
                       r"macosx_10_12_x86_64\.macosx_11_0_arm64\.macosx_10_12_universal2"]
          compiled = [n for n in names if "-cp311-abi3-" in n]
          pure, sdist = f"{stem}-py3-none-any.whl", f"{stem}.tar.gz"
          errors = []
          for tag in platforms:
              pattern = rf"{re.escape(stem)}-cp311-abi3-{tag}\.whl"
              if len([n for n in compiled if re.fullmatch(pattern, n)]) != 1:
                  errors.append(f"no single compiled wheel for {tag}")
          if sorted(compiled + [pure, sdist]) != names or len(compiled) != len(platforms):
              errors.append(f"unexpected distributions: {names}")

          def sources(members):
              return sorted(n for n in members
                            if n.startswith("cryptovault/") and n.endswith(".py"))

          reference = None
          for name in compiled + [pure]:
              members = zipfile.ZipFile(dist / name).namelist()
              # auditwheel vendors libgcc_s (Rust's unwinder) into musllinux wheels.
              vendored = ("cryptovault_py.libs/",) if "musllinux" in name else ()
              outside = [n for n in members if not n.startswith(
                  ("cryptovault/", f"{stem}.dist-info/", *vendored))]
              native = [n for n in members
                        if re.fullmatch(r"cryptovault/_native\..*(pyd|so)", n)]
              if outside:
                  errors.append(f"{name}: files outside the package: {outside}")
              if len(native) != (0 if name == pure else 1):
                  errors.append(f"{name}: extension modules {native}")
              reference = reference or sources(members)
              if sources(members) != reference:
                  errors.append(f"{name}: Python sources differ from the other wheels")
          allowed = re.compile(
              rf"{re.escape(stem)}(/(LICENSE-APACHE|LICENSE-MIT|PKG-INFO|README\.md"
              r"|pyproject\.toml|native(/Cargo\.(toml|lock)|/src(/.*\.rs)?)?"
              r"|src(/cryptovault(/.*)?)?))?")
          for member in tarfile.open(dist / sdist).getnames():
              if not allowed.fullmatch(member):
                  errors.append(f"{sdist}: unexpected {member}")
          if errors:
              sys.exit("\n".join(errors))
          print("OK:", *names, sep="\n  ")
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The wheels as a consumer gets them: installed into a clean environment,
  # imported from outside the source tree, run with and without `-O` (which
  # strips `assert`), against whatever cryptography/OpenSSL resolves. pip
  # picks the compiled wheel, which must load the extension; the pure wheel,
  # installed on its own, must run on the Python codecs.
  smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [gate, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Write the smoke script
        working-directory: ${{ runner.temp }}
        run: |
          cat > smoke.py <<'EOF'
          import importlib.metadata, os, sys

          import cryptography
          from cryptography.hazmat.backends.openssl import backend

          import cryptovault
          from cryptovault import CryptoVault, CryptoVaultError, generate_dek, generate_salt
          from cryptovault.fec import (ConcatenatedFec, NoFec, ReedSolomonCodec,
                                       ViterbiOnlyFec, _codecs)
          from cryptovault.cipher import Aes256GcmSivCipher
          from cryptovault.kdf import Argon2Kdf

          assert_ = lambda ok, what: ok or sys.exit(f"FAIL: {what}")
          print(sys.version.split()[0], "cryptography", cryptography.__version__,
                backend.openssl_version_text(), "optimize", sys.flags.optimize,
                "codecs", _codecs.ACTIVE.name)
          assert_(importlib.metadata.version("cryptovault-py") == os.environ["VERSION"],
                  "installed version")
          assert_(_codecs.ACTIVE.name == os.environ["BACKEND"], "codec backend")
          assert_(not cryptovault.__file__.startswith(os.getcwd() + os.sep + "src"),
                  "imported from the source tree")
          key, kek, salt, dek = generate_dek(), generate_dek(), generate_salt(), generate_dek()
          text = "smoke " * 20000
          strategies = [ConcatenatedFec.default(),
                        ConcatenatedFec.with_csprng_from_master(key, 5),
                        ViterbiOnlyFec(), ReedSolomonCodec(), NoFec()]
          for fec in strategies:
              vault = CryptoVault(Argon2Kdf(), Aes256GcmSivCipher(), fec)
              blob = vault.encrypt_with_key(key, text)
              assert_(vault.decrypt_with_key(key, blob) == text, f"round trip {fec!r}")
              wrapped = vault.wrap_key(kek, salt, dek)
              assert_(vault.unwrap_key(kek, salt, wrapped) == dek, f"key wrap {fec!r}")
              try:
                  vault.decrypt_with_key(generate_dek(), blob)
              except CryptoVaultError:
                  pass
              else:
                  sys.exit(f"FAIL: wrong key accepted under {fec!r}")
          vault = CryptoVault.default()
          master = vault.derive_key("correct horse", salt)
          assert_(vault.decrypt_with_key(master, vault.encrypt_with_key(master, "x")) == "x",
                  "default vault with an Argon2id key")
          print("SMOKE OK")
          EOF
      - name: Compiled wheel, with and without -O
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BACKEND: native
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/native" --python "${{ matrix.python }}"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/native/Scripts/python.exe"; else PY="$RUNNER_TEMP/native/bin/python"; fi
          uv pip install --python "$PY" --find-links dist "cryptovault-py==$VERSION"
          cd "$RUNNER_TEMP"
          "$PY" -I smoke.py
          "$PY" -I -O smoke.py
      - name: Pure-Python wheel, with and without -O
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          BACKEND: python
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/pure" --python "${{ matrix.python }}"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/pure/Scripts/python.exe"; else PY="$RUNNER_TEMP/pure/bin/python"; fi
          uv pip install --python "$PY" "dist/cryptovault_py-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$PY" -I smoke.py
          "$PY" -I -O smoke.py

  # PyPI comes BEFORE the tag: a publish is irreversible (yank only), so it is
  # the last thing that can genuinely fail. If it does, no tag is created and
  # the run can be retried. Trusted publishing: no token is stored anywhere;
  # PyPI trusts this workflow in the `pypi` environment of this repository.
  publish:
    name: Publish to PyPI
    needs: [gate, verify, smoke]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cryptovault-py/${{ needs.gate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # `skip-existing` makes a re-run idempotent when a previous run published
      # but failed before tagging.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  release:
    name: Tag and GitHub Release
    needs: [gate, publish]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # Written outside the globbed directory first, so the glob cannot
          # pick up the (empty) checksum file and hash it into itself.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
          sha256sum -c --strict SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::the CHANGELOG section for $VERSION is empty."
          fi
          cat release-notes.md
      # `tag_name` on a branch ref creates the tag at this SHA and the release
      # in one step, so the tag only exists once everything above succeeded.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
