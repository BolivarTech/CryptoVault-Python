name: Release

# The version in `pyproject.toml` is the SINGLE SOURCE OF TRUTH for a release.
#
# Push a version bump to `main` and this workflow validates it, runs the CI
# suite, builds the sdist and the wheel, installs the wheel in clean
# environments, publishes to PyPI and only THEN creates the `vX.Y.Z` tag and the
# GitHub Release. Pushes that do not change the version are a no-op: the gate
# reports "already released" and nothing downstream runs.
#
# The tag is created last so that it means exactly one thing: this version
# built, passed, published and released. A tag pushed first would be left
# pointing at a broken commit whenever a later step failed.
on:
  push:
    branches: [main]
  # PRs run the GATE ONLY, never a build or a release, so a version rollback or
  # a bump without a CHANGELOG entry is caught at review time, not after merge.
  pull_request:
    branches: [main]
  # Manual dry-run: CI, build and wheel smoke WITHOUT publishing or tagging.
  workflow_dispatch:

# Serialise release runs. `cancel-in-progress: false` lets a run that may
# already have published finish instead of being killed by the next merge.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything hangs off this job, so a bad bump costs seconds instead of a
  # full build. It answers: "should this push cut a release, and is it safe?"
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      is_new_version: ${{ steps.gate.outputs.is_new_version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      # `fetch-depth: 0` because the rollback check needs the full tag list; a
      # shallow clone fetches no tags and would conclude nothing was released.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: gate
        name: Resolve version, block rollbacks, decide whether to release
        run: |
          set -euo pipefail

          # The first `version = ` at column 0 is the [project] one.
          V="$(grep -m1 '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ -z "$V" ]; then
            echo "::error::could not extract the project version from pyproject.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $V"

          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$V' is not a plain X.Y.Z; refusing to derive a tag from it."
            exit 1
          fi

          NEWVER=true

          # ROLLBACK PROTECTION against the highest X.Y.Z ever tagged, not
          # against "does vX.Y.Z exist": rolling back to an old released
          # version would otherwise look like a harmless no-op.
          MAX="$(git tag -l 'v*' | sed 's/^v//' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          echo "highest version released so far: ${MAX:-<none>}"

          if [ -z "$MAX" ]; then
            echo "No release tags yet; $V will be the first."
          elif [ "$V" = "$MAX" ]; then
            echo "Version $V is already released as v$MAX; nothing to release."
            NEWVER=false
          elif [ "$(printf '%s\n%s\n' "$V" "$MAX" | sort -V | head -1)" = "$V" ]; then
            echo "::error::ROLLBACK BLOCKED: pyproject.toml declares $V but v$MAX is already released. Bump past $MAX or restore the correct version."
            exit 1
          else
            echo "New version $V > $MAX."
          fi

          if [ "$NEWVER" = "true" ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists but is not the highest release; refusing to overwrite it."
            exit 1
          fi
          echo "is_new_version=$NEWVER" >> "$GITHUB_OUTPUT"

          # Releasing needs BOTH a new version and a push to main.
          SHOULD="$NEWVER"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Event is '${{ github.event_name }}': validation only, nothing is published or tagged."
            SHOULD=false
          fi
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "--> is_new_version=$NEWVER  should_release=$SHOULD"

      # A bump committed without its lockfile would make every `--locked` step
      # downstream fail; this re-resolves against the committed lock in seconds.
      - uses: astral-sh/setup-uv@v6
      - name: Assert uv.lock is in sync with pyproject.toml
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' and commit the result together with the version bump."
            exit 1
          fi

      # Keyed on `is_new_version`, so a PR that bumps is told at review time.
      # The release notes are extracted from this section, and a section still
      # marked "Unreleased" would ship notes that contradict the release.
      - name: Assert CHANGELOG has a dated entry for this version
        if: steps.gate.outputs.is_new_version == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.gate.outputs.version }}"
          if ! grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$V] - YYYY-MM-DD' section. Add or date it before releasing."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $V with a release date."

  # The same suite as every push and PR, defined once in ci.yml. Only for a
  # real release or a dry-run: ci.yml already runs on each push to main.
  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist and wheel
    needs: [gate, ci]
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # Proof, not assumption: the distributions carry the package, its
      # metadata and the licenses, and nothing else (no tests, fixtures or the
      # Rust interop tool).
      - name: Verify distribution names and contents
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, sys, tarfile, zipfile

          v = os.environ["VERSION"]
          dist = pathlib.Path("dist")
          wheel = dist / f"cryptovault-{v}-py3-none-any.whl"
          sdist = dist / f"cryptovault-{v}.tar.gz"
          # uv build also drops a `.gitignore` in dist/; hidden files are never uploaded.
          found = sorted(p.name for p in dist.iterdir() if not p.name.startswith("."))
          if found != sorted([wheel.name, sdist.name]):
              sys.exit(f"unexpected distributions: {found}")

          bad = [n for n in zipfile.ZipFile(wheel).namelist()
                 if not n.startswith(("cryptovault/", f"cryptovault-{v}.dist-info/"))]
          root = f"cryptovault-{v}"
          allowed = {f"{root}/{n}" for n in ("LICENSE-APACHE", "LICENSE-MIT",
                     "PKG-INFO", "README.md", "pyproject.toml", "pyproject.toml.orig")}
          allowed |= {root, f"{root}/src"}
          bad += [n for n in tarfile.open(sdist).getnames()
                  if n not in allowed and not n.startswith(f"{root}/src/cryptovault")]
          if bad:
              sys.exit(f"files outside the package in the distributions: {bad}")
          print("OK:", found)
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The wheel as a consumer gets it: installed from the file into a clean
  # environment, imported from outside the source tree, run with and without
  # `-O` (which strips `assert`), against whatever cryptography/OpenSSL resolves.
  smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Install the wheel in a clean environment
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/smoke" --python "${{ matrix.python }}"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/smoke/Scripts/python.exe"; else PY="$RUNNER_TEMP/smoke/bin/python"; fi
          uv pip install --python "$PY" dist/*.whl
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Round-trip every strategy with and without -O
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          cat > smoke.py <<'EOF'
          import importlib.metadata, os, sys

          import cryptography
          from cryptography.hazmat.backends.openssl import backend

          import cryptovault
          from cryptovault import CryptoVault, CryptoVaultError, generate_dek, generate_salt
          from cryptovault.fec import (ConcatenatedFec, NoFec, ReedSolomonCodec,
                                       ViterbiOnlyFec)
          from cryptovault.cipher import Aes256GcmSivCipher
          from cryptovault.kdf import Argon2Kdf

          assert_ = lambda ok, what: ok or sys.exit(f"FAIL: {what}")
          print(sys.version.split()[0], "cryptography", cryptography.__version__,
                backend.openssl_version_text(), "optimize", sys.flags.optimize)
          assert_(importlib.metadata.version("cryptovault") == os.environ["VERSION"],
                  "installed version")
          assert_(not cryptovault.__file__.startswith(os.getcwd() + os.sep + "src"),
                  "imported from the source tree")
          key, kek, salt, dek = generate_dek(), generate_dek(), generate_salt(), generate_dek()
          text = "smoke " * 20000
          strategies = [ConcatenatedFec.default(), ConcatenatedFec.with_csprng_from_master(key, 5),
                        ViterbiOnlyFec(), ReedSolomonCodec(), NoFec()]
          for fec in strategies:
              vault = CryptoVault(Argon2Kdf(), Aes256GcmSivCipher(), fec)
              blob = vault.encrypt_with_key(key, text)
              assert_(vault.decrypt_with_key(key, blob) == text, f"round trip {fec!r}")
              wrapped = vault.wrap_key(kek, salt, dek)
              assert_(vault.unwrap_key(kek, salt, wrapped) == dek, f"key wrap {fec!r}")
              try:
                  vault.decrypt_with_key(generate_dek(), blob)
              except CryptoVaultError:
                  pass
              else:
                  sys.exit(f"FAIL: wrong key accepted under {fec!r}")
          vault = CryptoVault.default()
          master = vault.derive_key("correct horse", salt)
          assert_(vault.decrypt_with_key(master, vault.encrypt_with_key(master, "x")) == "x",
                  "default vault with an Argon2id key")
          print("SMOKE OK")
          EOF
          "$PY" -I smoke.py
          "$PY" -I -O smoke.py

  # PyPI comes BEFORE the tag: a publish is irreversible (yank only), so it is
  # the last thing that can genuinely fail. If it does, no tag is created and
  # the run can be retried. Trusted publishing: no token is stored anywhere;
  # PyPI trusts this workflow in the `pypi` environment of this repository.
  publish:
    name: Publish to PyPI
    needs: [gate, build, smoke]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cryptovault/${{ needs.gate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # `skip-existing` makes a re-run idempotent when a previous run published
      # but failed before tagging.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Tag and GitHub Release
    needs: [gate, publish]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # Written outside the globbed directory first, so the glob cannot
          # pick up the (empty) checksum file and hash it into itself.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
          sha256sum -c --strict SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::the CHANGELOG section for $VERSION is empty."
          fi
          cat release-notes.md
      # `tag_name` on a branch ref creates the tag at this SHA and the release
      # in one step, so the tag only exists once everything above succeeded.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
